<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Layout màu -->
  <div class="gridoverlay">
    <div class="gridcontainer">

      <div class="gridwrapper gridwrapper--header">
        <div class="gridcontent gridcontent--header"></div>
      </div>

      <div class="gridwrapper gridwrapper--content">
        <div class="gridcontent gridcontent--sidebar col-3">
          <div class="gridblock"></div>
          <div class="gridblock"></div>
          <div class="gridblock"></div>
          <div class="gridblock"></div>
        </div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--content"></div>
        <div class="gridcontent gridcontent--sidebar col-3">
          <div class="gridblock gridblock--tall"></div>
        </div>
      </div>

      <div class="gridwrapper gridwrapper--footer">
        <div class="gridcontent gridcontent--footer"></div>
      </div>

    </div>
  </div>

  <!-- Lưới 12 cột hướng dẫn (mờ) -->
  <div class="gridcontainer gridcontainer--guide">
    <div class="gridwrapper gridwrapper--guide">
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
    </div>
  </div>

  <p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
