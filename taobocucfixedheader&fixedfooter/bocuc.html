<!DOCTYPE html>
<html lang="vi">
    <head>
        <style>
            body{
                margin:0;
                color:hsl(228, 91%, 4%);
                 padding-top:60px; 
            }
            h1, h2, p{
                padding: 20px;
            }

            .navbar{
                overflow: hidden;
                background-color:#2a2c8d;
                position:fixed;
                top:0;
                width:100%;
            }

            .navbar a{
                float: right;
                display: block;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
        </style>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Hướng dẫn tạo Fixed Menu</title>
    </head>
    <body>
        <div class="navbar">
            <a href="#home">home</a>
            <a href="#news">news</a>
            <a href="#contact">contact</a>
            <a href="#about">about</a>
        </div>

        <h1>fixed top menu</h1>
        <h2>Scroll down this page to see the effect</h2>

        <p>Scroll down this page to see how the top menu behaves with a fixed position.</p>

        <h2>Scroll Down</h2>

        <p>Scroll down to see the sticky effect.</p>
    </body>
</html>
