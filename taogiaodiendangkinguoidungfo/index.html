<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng ký người dùng</title>
    <style>
        body {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background: #eef3f7;
            color: #22303c;
            margin: 0;
            padding: 24px 12px;
        }
        form {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            padding: 24px 28px;
            border: 1px solid #cfd9e2;
            border-radius: 6px;
        }
        h2 { margin: 0 0 20px; color: #1d5f8a; }
        .field { margin-bottom: 16px; }
        .title { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            font: inherit;
            border: 1px solid #b8c6d2;
            border-radius: 4px;
        }
        input:focus { outline: 2px solid #1d5f8a; border-color: #1d5f8a; }
        .options label { margin-right: 16px; }
        button {
            font: inherit;
            padding: 9px 20px;
            border-radius: 4px;
            border: 1px solid #1d5f8a;
            background: #1d5f8a;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
<form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
    <h2>Đăng ký người dùng</h2>

    <div class="field">
        <label class="title" for="name">Họ và tên</label>
        <input type="text" id="name" name="name">
    </div>

    <div class="field">
        <label class="title" for="email">Email</label>
        <input type="email" id="email" name="email">
    </div>

    <div class="field">
        <label class="title" for="phone">Số điện thoại</label>
        <input type="tel" id="phone" name="phone">
    </div>

    <div class="field">
        <span class="title">Giới tính</span>
        <div class="options">
            <label><input type="radio" name="gender" value="Nam"> Nam</label>
            <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
            <label><input type="radio" name="gender" value="Khác"> Khác</label>
        </div>
    </div>

    <button type="submit">Đăng ký</button>
</form>
</body>
</html>
