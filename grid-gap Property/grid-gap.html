<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS | grid-gap</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h2 {
        margin-top: 30px;
    }

    /* Ví dụ 1: cùng khoảng cách cho hàng và cột */
    .grid-container-1 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-gap: 20px;
    }

    .grid-container-1 div {
        background-color: lightblue;
        padding: 20px;
        text-align: center;
    }

    /* Ví dụ 2: khoảng cách hàng và cột khác nhau */
    .grid-container-2 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-gap: 30px 10px;
    }

    .grid-container-2 div {
        background-color: lightgreen;
        padding: 20px;
        text-align: center;
    }
</style>
</head>
<body>

<h2>Ví dụ 1: grid-gap: 20px</h2>
<div class="grid-container-1">
    <div>Ô 1</div>
    <div>Ô 2</div>
    <div>Ô 3</div>
    <div>Ô 4</div>
</div>

<h2>Ví dụ 2: grid-gap: 30px 10px</h2>
<div class="grid-container-2">
    <div>Ô 1</div>
    <div>Ô 2</div>
    <div>Ô 3</div>
    <div>Ô 4</div>
    <div>Ô 5</div>
    <div>Ô 6</div>
</div>

</body>
</html>
