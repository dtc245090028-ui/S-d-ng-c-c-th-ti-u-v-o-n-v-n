<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS | flex-basis</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h2 {
        margin: 30px 0 10px;
    }

    /* Ví dụ 1: flex-basis với px */
    .container-1 {
        display: flex;
        gap: 10px;
    }

    .container-1 .item {
        padding: 20px;
        background-color: lightblue;
    }

    .container-1 .item1 { flex-basis: 200px; }
    .container-1 .item2 { flex-basis: 100px; }
    .container-1 .item3 { flex-basis: 150px; }

    /* Ví dụ 2: flex-basis với flex-direction: column */
    .container-2 {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 500px;
        border: 2px solid #999;
    }

    .container-2 .item {
        flex-basis: 100px;
        padding: 20px;
        background-color: lightgreen;
    }

    /* Ví dụ 3: flex-basis với % */
    .container-3 {
        display: flex;
        gap: 10px;
    }

    .container-3 .item {
        flex-basis: 50%;
        padding: 20px;
        background-color: lightcoral;
        box-sizing: border-box;
    }

    /* Ví dụ 4: flex-basis kết hợp flex-grow */
    .container-4 {
        display: flex;
        width: 600px;
        gap: 10px;
    }

    .container-4 .item {
        padding: 20px;
        background-color: lightblue;
    }

    .container-4 .item1 {
        flex-basis: 100px;
        flex-grow: 1;
    }

    .container-4 .item2 {
        flex-basis: 100px;
        flex-grow: 2;
        background-color: lightsalmon;
    }

    .container-4 .item3 {
        flex-basis: 100px;
        flex-grow: 1;
    }
</style>
</head>
<body>

<h2>Ví dụ 1: flex-basis với px (200px, 100px, 150px)</h2>
<div class="container-1">
    <div class="item item1">Item 1</div>
    <div class="item item2">Item 2</div>
    <div class="item item3">Item 3</div>
</div>

<h2>Ví dụ 2: flex-basis: 100px với flex-direction: column</h2>
<div class="container-2">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
</div>

<h2>Ví dụ 3: flex-basis: 50%</h2>
<div class="container-3">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
</div>

<h2>Ví dụ 4: flex-basis kết hợp flex-grow (1 : 2 : 1)</h2>
<div class="container-4">
    <div class="item item1">Item 1</div>
    <div class="item item2">Item 2</div>
    <div class="item item3">Item 3</div>
</div>

</body>
</html>
