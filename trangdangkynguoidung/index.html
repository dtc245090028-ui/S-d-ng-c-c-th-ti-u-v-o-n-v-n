<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row g-0 shadow rounded overflow-hidden bg-white">

            <!-- Cột trái: Carousel lợi ích dịch vụ -->
            <div class="col-12 col-lg-6">
                <div id="benefitCarousel" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#benefitCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>

                    <div class="carousel-inner h-100">
                        <div class="carousel-item active h-100">
                            <img src="https://picsum.photos/id/1015/800/900" class="d-block w-100 h-100 object-fit-cover" alt="Nhanh chóng" style="min-height: 300px;">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded mb-4">
                                <h5><i class="fas fa-bolt"></i> Nhanh chóng</h5>
                                <p class="mb-0">Đăng ký chỉ trong vài giây, bắt đầu sử dụng ngay.</p>
                            </div>
                        </div>
                        <div class="carousel-item h-100">
                            <img src="https://picsum.photos/id/1018/800/900" class="d-block w-100 h-100 object-fit-cover" alt="An toàn" style="min-height: 300px;">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded mb-4">
                                <h5><i class="fas fa-shield-alt"></i> An toàn</h5>
                                <p class="mb-0">Thông tin của bạn được bảo mật tuyệt đối.</p>
                            </div>
                        </div>
                        <div class="carousel-item h-100">
                            <img src="https://picsum.photos/id/1039/800/900" class="d-block w-100 h-100 object-fit-cover" alt="Hỗ trợ" style="min-height: 300px;">
                            <div class="carousel-caption bg-dark bg-opacity-50 rounded mb-4">
                                <h5><i class="fas fa-headset"></i> Hỗ trợ 24/7</h5>
                                <p class="mb-0">Đội ngũ luôn sẵn sàng giải đáp mọi thắc mắc.</p>
                            </div>
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#benefitCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#benefitCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>

            <!-- Cột phải: Form đăng ký -->
            <div class="col-12 col-lg-6">
                <div class="p-4 p-md-5">
                    <h2 class="text-center mb-1">Tạo tài khoản</h2>
                    <p class="text-center text-muted mb-4">Tham gia cùng chúng tôi ngay hôm nay</p>

                    <form action="#" method="post">

                        <div class="mb-3">
                            <label for="fullname" class="form-label">Họ và tên</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus"></i> Đăng ký
                            </button>
                        </div>

                        <p class="text-center text-muted mt-3 mb-0">
                            Đã có tài khoản? <a href="#">Đăng nhập</a>
                        </p>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
